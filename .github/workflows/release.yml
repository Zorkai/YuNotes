# Builds YuNotes on every push to main and publishes it as a GitHub Release.
# The installed app (Services/UpdateService.cs) watches the latest release and
# updates itself, so merging to main is all it takes to ship.
#
# Version: <YuNotesVersion> in Directory.Build.props is the floor. If a release
# with that version (or newer) already exists, the build number is bumped past
# the newest release, e.g. props 1.1.24.0 + existing v1.1.24.0 -> v1.1.25.0.
# Raise the props version yourself for a minor/major bump.
#
# Signing: the package must be signed with the same certificate the installed
# app was signed with, or Windows refuses the update. Repository secrets:
#   SIGNING_CERT_BASE64    base64 of packaging/YuNotes.pfx
#   SIGNING_CERT_PASSWORD  its password
# Without them the workflow still builds (as a check) but publishes nothing.

name: Build and release

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'Directory.Build.props'
      - 'YuNotes.sln'
      - '.github/workflows/release.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Never run two releases at once: they would pick the same version number.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    env:
      HAS_CERT: ${{ secrets.SIGNING_CERT_BASE64 != '' }}
      PUBLISH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # tags + history for the version and release notes

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # Unit tests (tests/YuNotes.Tests) run before anything is built for
      # release: a failing test stops the workflow, so nothing is published.
      - name: Run tests
        shell: pwsh
        run: dotnet test tests/YuNotes.Tests -c Release --logger "console;verbosity=normal"

      - name: Work out version
        id: ver
        shell: pwsh
        run: |
          $props = Get-Content Directory.Build.props -Raw
          if ($props -notmatch '<YuNotesVersion>([\d\.]+)</YuNotesVersion>') { throw "YuNotesVersion not found" }
          $base = [version]$Matches[1]

          $released = git tag --list 'v*' | ForEach-Object {
              $v = $null
              if ([version]::TryParse($_.TrimStart('v'), [ref]$v)) { $v }
          } | Sort-Object -Descending
          $latest = $released | Select-Object -First 1

          if ($latest -and $latest -ge $base) {
              $version = [version]::new($latest.Major, $latest.Minor, $latest.Build + 1, 0)
          } else {
              $version = [version]::new($base.Major, $base.Minor, $base.Build, 0)
          }
          Write-Host "Props: $base  Latest release: $latest  -> Building $version"
          "version=$version" >> $env:GITHUB_OUTPUT
          "previous=$(if ($latest) { "v$latest" })" >> $env:GITHUB_OUTPUT

      - name: Build (unsigned check)
        if: env.HAS_CERT != 'true' || env.PUBLISH != 'true'
        shell: pwsh
        run: |
          dotnet build src/YuNotes/YuNotes.csproj -c Release -p:Platform=x64 `
            -p:YuNotesVersion=${{ steps.ver.outputs.version }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($env:HAS_CERT -ne 'true') {
            Write-Host "::warning::SIGNING_CERT_BASE64 is not set, so nothing was published. See the comment at the top of release.yml."
          }

      - name: Build signed MSIX
        if: env.HAS_CERT == 'true' && env.PUBLISH == 'true'
        shell: pwsh
        env:
          CERT_B64: ${{ secrets.SIGNING_CERT_BASE64 }}
          CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'YuNotes.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CERT_B64))

          $out = Join-Path $env:RUNNER_TEMP 'msix'
          dotnet build src/YuNotes/YuNotes.csproj -c Release -p:Platform=x64 `
            -p:YuNotesVersion=${{ steps.ver.outputs.version }} `
            -p:GenerateAppxPackageOnBuild=true `
            -p:AppxBundle=Never `
            -p:AppxPackageSigningEnabled=true `
            -p:PackageCertificateKeyFile="$pfx" `
            -p:PackageCertificatePassword="$env:CERT_PASSWORD" `
            -p:AppxPackageDir="$out\"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $msix = Get-ChildItem $out -Recurse -Filter *.msix | Select-Object -First 1
          if (-not $msix) { throw "No .msix was produced." }

          # Public half of the signing cert, for first-time installs.
          $cert = [Security.Cryptography.X509Certificates.X509Certificate2]::new($pfx, $env:CERT_PASSWORD)
          $dist = Join-Path $env:GITHUB_WORKSPACE 'dist'
          New-Item -ItemType Directory $dist | Out-Null
          Copy-Item $msix.FullName (Join-Path $dist $msix.Name)
          [IO.File]::WriteAllBytes((Join-Path $dist 'YuNotes.cer'), $cert.Export('Cert'))
          Remove-Item $pfx

          # Release notes: commit subjects since the previous release.
          $range = if ('${{ steps.ver.outputs.previous }}') { '${{ steps.ver.outputs.previous }}..HEAD' } else { '-20' }
          $log = git log $range --no-merges --pretty='- %s'
          @(
            "## What's new"
            ''
            $log
            ''
            '## Install'
            'Already have YuNotes? It updates itself. New install: download `YuNotes.cer`, install it to'
            '*Local Machine > Trusted People* (once), then open the `.msix`.'
          ) | Set-Content (Join-Path $dist 'notes.md') -Encoding utf8

      - name: Publish release
        if: env.HAS_CERT == 'true' && env.PUBLISH == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: YuNotes ${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          body_path: dist/notes.md
          files: |
            dist/*.msix
            dist/YuNotes.cer
          make_latest: true
